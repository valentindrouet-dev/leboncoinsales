<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeBonCoin Sales</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #f56040;
      --accent2: #ff8c69;
      --green: #3ecf8e;
      --yellow: #f5c842;
      --blue: #4f8ef7;
      --text: #e8eaf0;
      --text2: #8a8fa8;
      --text3: #5a5f78;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
      text-decoration: none;
    }
    .logo-icon {
      width: 30px; height: 30px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    nav { display: flex; gap: 4px; margin-left: 16px; }
    nav a {
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--text2);
      text-decoration: none;
      font-size: 13.5px;
      cursor: pointer;
      transition: all .15s;
    }
    nav a.active, nav a:hover { background: var(--surface2); color: var(--text); }
    nav a.active { color: var(--text); font-weight: 600; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 16px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--text3); }
    .btn-sm { padding: 5px 11px; font-size: 12.5px; }
    .btn-danger { background: #c0392b22; color: #e74c3c; border: 1px solid #e74c3c44; }
    .btn-danger:hover { background: #e74c3c33; }

    /* MAIN */
    main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    /* SEARCH + STATS BAR */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); }
    .search-wrap input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border .15s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--text3); }

    /* STATS CARDS */
    .stats {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 22px;
      flex: 1;
      min-width: 140px;
    }
    .stat-label { color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-value.green { color: var(--green); }
    .stat-value.orange { color: var(--accent); }
    .stat-value.blue { color: var(--blue); }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-chip {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-chip:hover { border-color: var(--text3); color: var(--text); }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    select.filter-select {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    select.filter-select:focus { border-color: var(--accent); color: var(--text); }
    .filter-sep { color: var(--border); }
    .filter-label { color: var(--text3); font-size: 12.5px; }

    /* TABLE */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .table-header-bar {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .table-header-bar span { color: var(--text2); font-size: 13px; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      padding: 11px 16px;
      text-align: left;
      color: var(--text3);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      border-bottom: 1px solid var(--border);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
    }
    thead th:hover { color: var(--text2); }
    thead th .sort-icon { margin-left: 4px; opacity: .5; }
    thead th.sorted { color: var(--accent); }
    thead th.sorted .sort-icon { opacity: 1; }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td {
      padding: 13px 16px;
      vertical-align: middle;
    }
    .td-name { font-weight: 600; color: var(--text); }
    .td-date { color: var(--text2); white-space: nowrap; }
    .td-price {
      font-weight: 700;
      color: var(--green);
      white-space: nowrap;
    }
    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 500;
      margin: 2px 2px 2px 0;
    }
    .tag-blue { background: #4f8ef722; color: var(--blue); border: 1px solid #4f8ef744; }
    .tag-orange { background: #f5604022; color: var(--accent); border: 1px solid #f5604044; }
    .tag-green { background: #3ecf8e22; color: var(--green); border: 1px solid #3ecf8e44; }
    .tag-yellow { background: #f5c84222; color: var(--yellow); border: 1px solid #f5c84244; }
    .tag-purple { background: #a78bfa22; color: #a78bfa; border: 1px solid #a78bfa44; }
    .td-note { color: var(--text2); font-size: 13px; max-width: 200px; }
    .stars { color: var(--yellow); letter-spacing: -2px; }
    .actions { display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
    tbody tr:hover .actions { opacity: 1; }
    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all .15s;
    }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }
    .icon-btn.delete:hover { background: #e74c3c22; color: #e74c3c; border-color: #e74c3c44; }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty p { font-size: 15px; }

    /* MODAL */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(2px);
      animation: fadeIn .15s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      animation: slideUp .18s;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 { font-size: 17px; font-weight: 700; }
    .modal-body { padding: 20px 24px; }
    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* MULTI-ENTRY TABLE */
    .entry-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }
    .entry-table th {
      padding: 8px 10px;
      text-align: left;
      color: var(--text3);
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      border-bottom: 1px solid var(--border);
    }
    .entry-table td { padding: 6px 6px; vertical-align: middle; }
    .entry-table input, .entry-table textarea, .entry-table select {
      width: 100%;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border .15s;
      font-family: inherit;
    }
    .entry-table input:focus, .entry-table textarea:focus, .entry-table select:focus {
      border-color: var(--accent);
    }
    .entry-table input::placeholder, .entry-table textarea::placeholder { color: var(--text3); }
    .entry-table textarea { resize: none; height: 36px; line-height: 1.3; }
    .entry-table .col-del { width: 36px; text-align: center; }
    .entry-table .col-name { min-width: 180px; }
    .entry-table .col-date { width: 130px; }
    .entry-table .col-prix { width: 100px; }
    .entry-table .col-mots { min-width: 180px; }
    .entry-table .col-note { width: 80px; }
    .entry-table .col-txt { min-width: 160px; }

    /* STAR RATING INPUT */
    .star-input { display: flex; flex-direction: row-reverse; justify-content: flex-end; }
    .star-input input { display: none; }
    .star-input label {
      font-size: 20px;
      cursor: pointer;
      color: var(--border);
      transition: color .1s;
      padding: 0 1px;
    }
    .star-input input:checked ~ label,
    .star-input label:hover,
    .star-input label:hover ~ label {
      color: var(--yellow);
    }

    /* TAGS INPUT */
    .tags-input-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 36px;
      align-items: center;
      cursor: text;
    }
    .tags-input-wrap:focus-within { border-color: var(--accent); }
    .tags-input-wrap .tag { cursor: pointer; }
    .tags-input-wrap .tag::after { content: ' ×'; font-size: 10px; }
    .tags-input-wrap input {
      border: none !important;
      background: transparent !important;
      padding: 0 4px !important;
      min-width: 60px;
      flex: 1;
      font-size: 13px !important;
      color: var(--text) !important;
    }
    .tags-input-wrap input:focus { outline: none; box-shadow: none; }

    /* EDIT MODAL FORM */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: var(--text2); font-size: 12.5px; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: border .15s;
    }
    .form-control:focus { border-color: var(--accent); }
    .form-control::placeholder { color: var(--text3); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .star-input-lg { display: flex; flex-direction: row-reverse; justify-content: flex-end; }
    .star-input-lg input { display: none; }
    .star-input-lg label {
      font-size: 28px;
      cursor: pointer;
      color: var(--border);
      transition: color .1s;
      padding: 0 2px;
    }
    .star-input-lg input:checked ~ label,
    .star-input-lg label:hover,
    .star-input-lg label:hover ~ label { color: var(--yellow); }

    /* TOAST */
    .toast-container {
      position: fixed;
      bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 999;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13.5px;
      box-shadow: var(--shadow);
      animation: slideUp .2s;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid #e74c3c; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* RESPONSIVE */
    @media (max-width: 700px) {
      main { padding: 16px; }
      .stats { gap: 8px; }
      .form-row { grid-template-columns: 1fr; }
      thead th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-icon">🏷️</div>
    LBC Sales
  </a>
  <nav>
    <a class="active" id="tab-ventes" onclick="showTab('ventes')">Ventes</a>
    <a id="tab-stats" onclick="showTab('stats')">Statistiques</a>
  </nav>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()">⬇ Exporter CSV</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Ajouter</button>
  </div>
</header>

<main>
  <!-- STATS CARDS -->
  <div class="stats" id="stats-cards">
    <div class="stat-card">
      <div class="stat-label">Total ventes</div>
      <div class="stat-value blue" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Revenus totaux</div>
      <div class="stat-value green" id="stat-revenus">0 €</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Prix moyen</div>
      <div class="stat-value orange" id="stat-moyen">0 €</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ce mois</div>
      <div class="stat-value blue" id="stat-mois">0 €</div>
    </div>
  </div>

  <!-- VENTES TAB -->
  <div id="view-ventes">
    <div class="topbar">
      <div class="search-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Rechercher par nom, mot-clé, note…" oninput="renderTable()" />
      </div>
      <select class="filter-select" id="sort-select" onchange="renderTable()">
        <option value="date-desc">Date ↓</option>
        <option value="date-asc">Date ↑</option>
        <option value="prix-desc">Prix ↓</option>
        <option value="prix-asc">Prix ↑</option>
        <option value="nom-asc">Nom A→Z</option>
        <option value="nom-desc">Nom Z→A</option>
        <option value="note-desc">Note ↓</option>
      </select>
    </div>

    <div class="filters" id="filters-bar">
      <span class="filter-label">Mots-clés :</span>
      <!-- chips générés dynamiquement -->
    </div>

    <div class="table-wrap">
      <div class="table-header-bar">
        <span id="count-label">0 vente</span>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="openAddModal()">+ Ajouter des ventes</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:30px"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this)" style="cursor:pointer" /></th>
            <th>Nom</th>
            <th>Date</th>
            <th>Prix</th>
            <th>Mots-clés</th>
            <th>Note</th>
            <th>Commentaire</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div id="empty-state" class="empty" style="display:none">
        <div class="empty-icon">📦</div>
        <p>Aucune vente pour l'instant.<br>Cliquez sur <strong>+ Ajouter</strong> pour commencer.</p>
      </div>
    </div>

    <!-- DELETE SELECTED -->
    <div id="bulk-bar" style="display:none;margin-top:12px;display:none;align-items:center;gap:10px;">
      <span id="selected-count" style="color:var(--text2);font-size:13px;"></span>
      <button class="btn btn-danger btn-sm" onclick="deleteSelected()">🗑 Supprimer la sélection</button>
    </div>
  </div>

  <!-- STATS TAB -->
  <div id="view-stats" style="display:none;">
    <h2 style="margin-bottom:20px;font-size:18px;">Statistiques</h2>
    <div id="stats-detail"></div>
  </div>
</main>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toasts"></div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="modal" style="display:none" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Ajouter des ventes</h2>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
let sales = JSON.parse(localStorage.getItem('lbc_sales') || '[]');
let selectedIds = new Set();
let editingId = null;
let activeTagFilter = null;

function save() {
  localStorage.setItem('lbc_sales', JSON.stringify(sales));
}

function genId() {
  return Date.now() + Math.random().toString(36).slice(2);
}

// ── TAGS ──────────────────────────────────────────────────────────────────────
const TAG_COLORS = ['tag-blue', 'tag-orange', 'tag-green', 'tag-yellow', 'tag-purple'];
const tagColorMap = {};
function tagColor(t) {
  if (!tagColorMap[t]) {
    const keys = Object.keys(tagColorMap);
    tagColorMap[t] = TAG_COLORS[keys.length % TAG_COLORS.length];
  }
  return tagColorMap[t];
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const total = sales.length;
  const revenus = sales.reduce((a, s) => a + (parseFloat(s.prix) || 0), 0);
  const moyen = total ? (revenus / total) : 0;
  const now = new Date();
  const thisMois = sales
    .filter(s => { const d = new Date(s.date); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); })
    .reduce((a, s) => a + (parseFloat(s.prix) || 0), 0);

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-revenus').textContent = revenus.toFixed(2) + ' €';
  document.getElementById('stat-moyen').textContent = moyen.toFixed(2) + ' €';
  document.getElementById('stat-mois').textContent = thisMois.toFixed(2) + ' €';
}

// ── FILTER CHIPS ──────────────────────────────────────────────────────────────
function updateFilterChips() {
  const bar = document.getElementById('filters-bar');
  const allTags = [...new Set(sales.flatMap(s => s.tags || []))].sort();
  bar.innerHTML = '<span class="filter-label">Mots-clés :</span>';
  if (allTags.length === 0) {
    bar.innerHTML += '<span style="color:var(--text3);font-size:12.5px;">Aucun mot-clé</span>';
    return;
  }
  allTags.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (activeTagFilter === t ? ' active' : '');
    chip.textContent = t;
    chip.onclick = () => {
      activeTagFilter = activeTagFilter === t ? null : t;
      updateFilterChips();
      renderTable();
    };
    bar.appendChild(chip);
  });
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const sort = document.getElementById('sort-select').value;

  let filtered = sales.filter(s => {
    const matchSearch = !q || [s.nom, ...(s.tags || []), s.commentaire || ''].join(' ').toLowerCase().includes(q);
    const matchTag = !activeTagFilter || (s.tags || []).includes(activeTagFilter);
    return matchSearch && matchTag;
  });

  filtered.sort((a, b) => {
    switch (sort) {
      case 'date-desc': return new Date(b.date) - new Date(a.date);
      case 'date-asc':  return new Date(a.date) - new Date(b.date);
      case 'prix-desc': return (parseFloat(b.prix) || 0) - (parseFloat(a.prix) || 0);
      case 'prix-asc':  return (parseFloat(a.prix) || 0) - (parseFloat(b.prix) || 0);
      case 'nom-asc':   return a.nom.localeCompare(b.nom);
      case 'nom-desc':  return b.nom.localeCompare(a.nom);
      case 'note-desc': return (b.note || 0) - (a.note || 0);
      default: return 0;
    }
  });

  return filtered;
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('table-body');
  const empty = document.getElementById('empty-state');
  const countLabel = document.getElementById('count-label');

  countLabel.textContent = `${filtered.length} vente${filtered.length > 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = filtered.map(s => {
    const checked = selectedIds.has(s.id) ? 'checked' : '';
    const tags = (s.tags || []).map(t => `<span class="tag ${tagColor(t)}">${escHtml(t)}</span>`).join('');
    const stars = s.note ? '★'.repeat(s.note) + '☆'.repeat(5 - s.note) : '—';
    const starsClass = s.note ? 'stars' : '';
    const dateStr = s.date ? new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'}) : '—';
    return `<tr>
      <td><input type="checkbox" ${checked} onchange="toggleSelect('${s.id}',this)" style="cursor:pointer" /></td>
      <td class="td-name">${escHtml(s.nom)}</td>
      <td class="td-date">${dateStr}</td>
      <td class="td-price" style="font-weight:700;color:var(--green);white-space:nowrap">${s.prix ? (parseFloat(s.prix).toFixed(2) + ' €') : '—'}</td>
      <td>${tags || '<span style="color:var(--text3)">—</span>'}</td>
      <td><span class="${starsClass}">${stars}</span></td>
      <td class="td-note">${escHtml(s.commentaire || '')}</td>
      <td><div class="actions">
        <button class="icon-btn" title="Modifier" onclick="openEditModal('${s.id}')">✏️</button>
        <button class="icon-btn delete" title="Supprimer" onclick="deleteSale('${s.id}')">🗑</button>
      </div></td>
    </tr>`;
  }).join('');

  updateBulkBar();
  updateStats();
  updateFilterChips();
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── SELECT ────────────────────────────────────────────────────────────────────
function toggleSelect(id, el) {
  if (el.checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
}
function toggleSelectAll(el) {
  const filtered = getFiltered();
  if (el.checked) filtered.forEach(s => selectedIds.add(s.id));
  else filtered.forEach(s => selectedIds.delete(s.id));
  renderTable();
}
function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  const cnt = document.getElementById('selected-count');
  if (selectedIds.size > 0) {
    bar.style.display = 'flex';
    cnt.textContent = `${selectedIds.size} sélectionné${selectedIds.size > 1 ? 's' : ''}`;
  } else {
    bar.style.display = 'none';
  }
}
function deleteSelected() {
  if (!confirm(`Supprimer ${selectedIds.size} vente(s) ?`)) return;
  sales = sales.filter(s => !selectedIds.has(s.id));
  selectedIds.clear();
  save();
  renderTable();
  toast('Ventes supprimées', 'success');
}

// ── CRUD ──────────────────────────────────────────────────────────────────────
function deleteSale(id) {
  if (!confirm('Supprimer cette vente ?')) return;
  sales = sales.filter(s => s.id !== id);
  save();
  renderTable();
  toast('Vente supprimée', 'success');
}

// ── MODAL ADD (multi-row) ─────────────────────────────────────────────────────
let rows = [];

function openAddModal() {
  editingId = null;
  rows = [newRow()];
  document.getElementById('modal-title').textContent = 'Ajouter des ventes';
  renderAddModal();
  document.getElementById('modal').style.display = 'flex';
}

function newRow() {
  return { nom: '', date: today(), prix: '', tags: [], note: 0, commentaire: '' };
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function renderAddModal() {
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div style="overflow-x:auto;">
    <table class="entry-table">
      <thead><tr>
        <th class="col-name">Nom *</th>
        <th class="col-date">Date</th>
        <th class="col-prix">Prix (€)</th>
        <th class="col-mots">Mots-clés</th>
        <th class="col-note">Note</th>
        <th class="col-txt">Commentaire</th>
        <th class="col-del"></th>
      </tr></thead>
      <tbody id="add-rows"></tbody>
    </table>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="addRow()" style="margin-top:8px;">+ Ajouter une ligne</button>
  `;
  renderRows();

  const footer = document.getElementById('modal-footer');
  footer.innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" onclick="saveAll()">Enregistrer</button>
  `;
}

function renderRows() {
  const tbody = document.getElementById('add-rows');
  if (!tbody) return;
  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td class="col-name"><input type="text" value="${escHtml(r.nom)}" placeholder="Nom de l'article" oninput="rows[${i}].nom=this.value" /></td>
      <td class="col-date"><input type="date" value="${r.date}" oninput="rows[${i}].date=this.value" /></td>
      <td class="col-prix"><input type="number" step="0.01" min="0" value="${r.prix}" placeholder="0.00" oninput="rows[${i}].prix=this.value" /></td>
      <td class="col-mots"><input type="text" value="${(r.tags||[]).join(', ')}" placeholder="jeu, électro, vêtement…" oninput="rows[${i}].tags=parseTags(this.value)" /></td>
      <td class="col-note">
        <div class="star-input" id="stars-${i}">
          ${[5,4,3,2,1].map(v => `
            <input type="radio" id="s${i}-${v}" name="note-${i}" value="${v}" ${r.note==v?'checked':''} onchange="rows[${i}].note=${v}" />
            <label for="s${i}-${v}" title="${v} étoile${v>1?'s':''}">★</label>
          `).join('')}
        </div>
      </td>
      <td class="col-txt"><textarea placeholder="Commentaire…" oninput="rows[${i}].commentaire=this.value">${escHtml(r.commentaire||'')}</textarea></td>
      <td class="col-del"><button class="icon-btn delete" onclick="removeRow(${i})" title="Supprimer la ligne" ${rows.length===1?'disabled':''}>✕</button></td>
    </tr>
  `).join('');
}

function parseTags(str) {
  return str.split(',').map(t => t.trim()).filter(Boolean);
}

function addRow() {
  rows.push(newRow());
  renderRows();
}

function removeRow(i) {
  if (rows.length === 1) return;
  rows.splice(i, 1);
  renderRows();
}

function saveAll() {
  const valid = rows.filter(r => r.nom.trim());
  if (valid.length === 0) { toast('Renseignez au moins un nom', 'error'); return; }
  valid.forEach(r => {
    sales.push({ id: genId(), nom: r.nom.trim(), date: r.date, prix: r.prix, tags: r.tags, note: r.note, commentaire: r.commentaire });
  });
  save();
  closeModal();
  renderTable();
  toast(`${valid.length} vente${valid.length > 1 ? 's' : ''} ajoutée${valid.length > 1 ? 's' : ''}`, 'success');
}

// ── MODAL EDIT (single) ───────────────────────────────────────────────────────
function openEditModal(id) {
  editingId = id;
  const s = sales.find(x => x.id === id);
  if (!s) return;
  document.getElementById('modal-title').textContent = 'Modifier la vente';

  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <div class="form-row">
      <div class="form-group">
        <label>Nom *</label>
        <input class="form-control" id="e-nom" value="${escHtml(s.nom)}" placeholder="Nom de l'article" />
      </div>
      <div class="form-group">
        <label>Date</label>
        <input class="form-control" type="date" id="e-date" value="${s.date || ''}" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Prix (€)</label>
        <input class="form-control" type="number" step="0.01" min="0" id="e-prix" value="${s.prix || ''}" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label>Mots-clés <span style="color:var(--text3);font-weight:400">(séparés par virgule)</span></label>
        <input class="form-control" id="e-tags" value="${(s.tags||[]).join(', ')}" placeholder="jeu, électro, vêtement…" />
      </div>
    </div>
    <div class="form-group">
      <label>Note</label>
      <div class="star-input-lg">
        ${[5,4,3,2,1].map(v => `
          <input type="radio" id="es-${v}" name="edit-note" value="${v}" ${s.note==v?'checked':''} />
          <label for="es-${v}" title="${v} étoile${v>1?'s':''}">★</label>
        `).join('')}
      </div>
    </div>
    <div class="form-group">
      <label>Commentaire</label>
      <textarea class="form-control" id="e-comment" rows="3" placeholder="Notes, acheteur, état…">${escHtml(s.commentaire||'')}</textarea>
    </div>
  `;

  const footer = document.getElementById('modal-footer');
  footer.innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" onclick="saveEdit()">Enregistrer</button>
  `;

  document.getElementById('modal').style.display = 'flex';
}

function saveEdit() {
  const s = sales.find(x => x.id === editingId);
  if (!s) return;
  const nom = document.getElementById('e-nom').value.trim();
  if (!nom) { toast('Le nom est requis', 'error'); return; }
  s.nom = nom;
  s.date = document.getElementById('e-date').value;
  s.prix = document.getElementById('e-prix').value;
  s.tags = parseTags(document.getElementById('e-tags').value);
  const noteEl = document.querySelector('input[name="edit-note"]:checked');
  s.note = noteEl ? parseInt(noteEl.value) : 0;
  s.commentaire = document.getElementById('e-comment').value;
  save();
  closeModal();
  renderTable();
  toast('Vente modifiée', 'success');
}

// ── MODAL UTILS ───────────────────────────────────────────────────────────────
function closeModal() {
  document.getElementById('modal').style.display = 'none';
  rows = [];
  editingId = null;
}
function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── TABS ──────────────────────────────────────────────────────────────────────
function showTab(tab) {
  document.getElementById('view-ventes').style.display = tab === 'ventes' ? '' : 'none';
  document.getElementById('view-stats').style.display = tab === 'stats' ? '' : 'none';
  document.getElementById('tab-ventes').className = tab === 'ventes' ? 'active' : '';
  document.getElementById('tab-stats').className = tab === 'stats' ? 'active' : '';
  if (tab === 'stats') renderStatsDetail();
}

function renderStatsDetail() {
  const el = document.getElementById('stats-detail');
  if (sales.length === 0) { el.innerHTML = '<p style="color:var(--text3)">Aucune donnée.</p>'; return; }

  // par mois
  const byMonth = {};
  sales.forEach(s => {
    const key = s.date ? s.date.slice(0,7) : 'Inconnu';
    if (!byMonth[key]) byMonth[key] = { count: 0, total: 0 };
    byMonth[key].count++;
    byMonth[key].total += parseFloat(s.prix) || 0;
  });

  const months = Object.entries(byMonth).sort((a, b) => b[0].localeCompare(a[0]));

  // par tag
  const byTag = {};
  sales.forEach(s => (s.tags||[]).forEach(t => {
    if (!byTag[t]) byTag[t] = { count: 0, total: 0 };
    byTag[t].count++;
    byTag[t].total += parseFloat(s.prix) || 0;
  }));
  const tags = Object.entries(byTag).sort((a, b) => b[1].total - a[1].total).slice(0, 10);

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;flex-wrap:wrap">
      <div>
        <h3 style="margin-bottom:12px;font-size:15px;color:var(--text2)">Par mois</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Mois</th><th>Ventes</th><th>Revenus</th></tr></thead>
            <tbody>
              ${months.map(([m, v]) => {
                const [y, mo] = m.split('-');
                const label = m === 'Inconnu' ? 'Inconnu' : new Date(y, parseInt(mo)-1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
                return `<tr><td>${label}</td><td style="color:var(--blue)">${v.count}</td><td style="color:var(--green);font-weight:700">${v.total.toFixed(2)} €</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div>
        <h3 style="margin-bottom:12px;font-size:15px;color:var(--text2)">Top mots-clés</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Mot-clé</th><th>Ventes</th><th>Revenus</th></tr></thead>
            <tbody>
              ${tags.length ? tags.map(([t, v]) => `<tr>
                <td><span class="tag ${tagColor(t)}">${escHtml(t)}</span></td>
                <td style="color:var(--blue)">${v.count}</td>
                <td style="color:var(--green);font-weight:700">${v.total.toFixed(2)} €</td>
              </tr>`).join('') : '<tr><td colspan="3" style="color:var(--text3)">Aucun mot-clé</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

// ── EXPORT CSV ────────────────────────────────────────────────────────────────
function exportCSV() {
  const header = ['Nom', 'Date', 'Prix', 'Mots-clés', 'Note', 'Commentaire'];
  const rows = sales.map(s => [
    `"${s.nom.replace(/"/g,'""')}"`,
    s.date || '',
    s.prix || '',
    `"${(s.tags||[]).join(', ')}"`,
    s.note || '',
    `"${(s.commentaire||'').replace(/"/g,'""')}"`
  ].join(';'));
  const csv = [header.join(';'), ...rows].join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lbc-sales-${today()}.csv`;
  a.click();
  toast('Export CSV téléchargé', 'success');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = (type === 'success' ? '✅' : '❌') + ' ' + msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderTable();
</script>
</body>
</html>
